<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paytm AI Hub — Your AI-powered Paytm Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="mockup.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #dceaff 0%, #ebf4fe 40%, #f4f8fd 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Contained & Perfectly Scaled Desktop Dashboard Card (No Zoom / Razor Crisp) */
    .dashboard-wrapper {
      position: relative;
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      aspect-ratio: 1666 / 935;
      margin: 6px auto 20px auto;
      border-radius: 22px;
      box-shadow: 0 24px 60px -15px rgba(0, 41, 112, 0.22), 0 0 0 1px rgba(0, 41, 112, 0.08);
      background: #ffffff;
      overflow: hidden;
    }

    /* Crisp High-Res Image */
    .dashboard-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Hotspot Interactive Elements */
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    .hotspot:hover {
      background-color: rgba(0, 185, 241, 0.14);
      box-shadow: 0 0 0 2px rgba(0, 185, 241, 0.45);
    }

    .hotspot:active {
      transform: scale(0.96);
      background-color: rgba(0, 41, 112, 0.2);
    }

    /* Transparent Interactive Real Input Field */
    .real-chat-input {
      position: absolute;
      left: 18.3%;
      top: 38.5%;
      width: 59.1%;
      height: 7.5%;
      background: transparent;
      border: none;
      outline: none;
      font-size: clamp(12px, 1.0vw, 15px);
      font-weight: 600;
      color: #0f172a;
      padding: 0 12px;
      z-index: 25;
    }

    .real-chat-input::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Send Button Pulse & Glow */
    .hotspot-send {
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .hotspot-send:hover {
      background-color: rgba(0, 186, 242, 0.35);
      box-shadow: 0 0 22px rgba(0, 186, 242, 0.85);
      transform: scale(1.08);
    }

    .hotspot-send:active {
      transform: scale(0.92);
    }

    /* Top Sleek Breadcrumb / Back Bar */
    .top-nav-bar {
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      margin: 10px auto 4px auto;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #002970;
      padding: 7px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 41, 112, 0.1), 0 0 0 1px #e2e8f0;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .home-back-btn:hover {
      background: #002970;
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 41, 112, 0.2);
    }

    /* Voice Recording Pulse */
    .voice-pulsing {
      background-color: rgba(239, 68, 68, 0.4) !important;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.6) !important;
      animation: micPulse 1s infinite;
    }
    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body class="px-3 sm:px-6">

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Portal Transition Overlay -->
  <div id="portal-overlay" class="page-portal-overlay flex-col gap-4">
    <div class="w-16 h-16 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
    <div id="portal-text" class="text-xl font-bold tracking-wide">Connecting to Paytm AI Hub...</div>
  </div>

  <!-- Top Navigation Helper Bar -->
  <div class="top-nav-bar">
    <a href="index.html" class="home-back-btn interactive-btn">
      <span>←</span>
      <span>Back to Paytm Home</span>
    </a>
    <div class="text-xs font-semibold text-[#002970]/80 flex items-center gap-1.5 bg-white/80 backdrop-blur-xs px-3 py-1.5 rounded-full border border-white/80 shadow-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      <span>Paytm AI Hub Active • Groq + SerpApi + Sarvam</span>
    </div>
  </div>

  <!-- MAIN CONTAINED DASHBOARD (Comfortable, crisp, no over-zoom!) -->
  <div class="dashboard-wrapper">
    
    <!-- Original Clean High-Res 1666x935 Image -->
    <img src="assets/ai_hub_dashboard_clean.png" alt="Paytm AI Hub Dashboard" class="dashboard-img">

    <!-- ==================== 1. SEARCH / PROMPT BAR ==================== -->
    
    <!-- Real Working Text Input -->
    <input type="text" 
           id="ai-prompt-input" 
           class="real-chat-input" 
           placeholder="बोलिए या टाइप करें... (उदा. Jio 300 का 2GB daily data रिचार्ज, फ्लाइट बुकिंग, या पेंडिंग पेमेंट)"
           onkeydown="if(event.key === 'Enter') handleSend();">

    <!-- Mic Button (Voice Command with Real Auto-Execute) -->
    <div onclick="triggerVoice()" 
         id="dashboard-mic-btn"
         class="hotspot ripple-effect" 
         title="Click to Speak (हिंदी / English / मराठी)"
         style="left: 13.5%; top: 38.5%; width: 4.5%; height: 7.5%; border-radius: 9999px;">
    </div>

    <!-- Image Attachment Button -->
    <div onclick="triggerImageUpload()" 
         class="hotspot ripple-effect" 
         title="Attach Receipt or Screenshot"
         style="left: 78.0%; top: 38.5%; width: 3.6%; height: 7.5%; border-radius: 9999px;">
    </div>

    <!-- SEND BUTTON (Paper Plane Icon) -> Opens Background Workspace Page! -->
    <div onclick="handleSend()" 
         class="hotspot hotspot-send ripple-effect" 
         title="Send Command to Paytm AI Hub"
         style="left: 82.2%; top: 38.5%; width: 4.5%; height: 7.5%;">
    </div>


    <!-- ==================== 2. LANGUAGE SELECTOR ==================== -->
    <div onclick="switchLanguage()" 
         class="hotspot ripple-effect" 
         title="Switch Language: हिंदी • English • मराठी"
         style="left: 36.0%; top: 49.2%; width: 27.0%; height: 5.9%; border-radius: 9999px;">
    </div>


    <!-- ==================== 3. ACTION MODE CARD (LEFT) ==================== -->
    <div onclick="openMode('action')" 
         class="hotspot ripple-effect" 
         title="Action Mode (Paytm ONE) — Click to open Dedicated Action Mode!"
         style="left: 6.4%; top: 58.5%; width: 41.5%; height: 9.8%;">
    </div>

    <!-- 1. Recharge Button -->
    <div onclick="quickAction('Recharge')" 
         class="hotspot ripple-effect" 
         title="Mobile Recharge / Bill"
         style="left: 7.35%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 2. Travel Button -->
    <div onclick="quickAction('Travel')" 
         class="hotspot ripple-effect" 
         title="Travel Booking"
         style="left: 15.2%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 3. Shopping Button -->
    <div onclick="quickAction('Shopping')" 
         class="hotspot ripple-effect" 
         title="Shopping & Store Deals"
         style="left: 23.0%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 4. Bills Button -->
    <div onclick="quickAction('Bills')" 
         class="hotspot ripple-effect" 
         title="Pay Electricity / Utility Bills"
         style="left: 30.9%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 5. Offers Button -->
    <div onclick="quickAction('Offers')" 
         class="hotspot ripple-effect" 
         title="Cashback & Offers"
         style="left: 38.7%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>


    <!-- ==================== 4. RESOLVE MODE CARD (RIGHT) ==================== -->
    <div onclick="openMode('resolve')" 
         class="hotspot ripple-effect" 
         title="Resolve Mode (Paytm Resolve) — Click to open Dedicated Dispute Investigation Mode!"
         style="left: 51.5%; top: 58.5%; width: 42.0%; height: 9.8%;">
    </div>

    <!-- 1. Pending Button -->
    <div onclick="quickResolve('Pending')" 
         class="hotspot ripple-effect" 
         title="Check Pending Payments"
         style="left: 52.4%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 2. Refund Button -->
    <div onclick="quickResolve('Refund')" 
         class="hotspot ripple-effect" 
         title="Track Refund Status"
         style="left: 60.3%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 3. Failed Button -->
    <div onclick="quickResolve('Failed Payment')" 
         class="hotspot ripple-effect" 
         title="Resolve Failed Transactions"
         style="left: 68.1%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 4. Complaint Button -->
    <div onclick="quickResolve('Complaint')" 
         class="hotspot ripple-effect" 
         title="Raise Payment Complaint"
         style="left: 76.0%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>

    <!-- 5. Track Button -->
    <div onclick="quickResolve('Track')" 
         class="hotspot ripple-effect" 
         title="Track Open Issues"
         style="left: 83.8%; top: 69.0%; width: 6.6%; height: 10.5%;">
    </div>


    <!-- ==================== 5. POPULAR THINGS YOU CAN DO (CHIPS) ==================== -->
    <!-- Chip 1: Recharge my mobile -->
    <div onclick="setChipPrompt('Jio 299 recharge 2gb daily data')" 
         class="hotspot ripple-effect" 
         title="Click to recharge mobile"
         style="left: 5.4%; top: 87.4%; width: 15.7%; height: 7.3%; border-radius: 9999px;">
    </div>

    <!-- Chip 2: Book a flight to Mumbai -->
    <div onclick="setChipPrompt('Pune to Mumbai flights and bus options')" 
         class="hotspot ripple-effect" 
         title="Click to book flight"
         style="left: 22.0%; top: 87.4%; width: 17.6%; height: 7.3%; border-radius: 9999px;">
    </div>

    <!-- Chip 3: Pay my electricity bill -->
    <div onclick="setChipPrompt('MSEDCL electricity bill payment')" 
         class="hotspot ripple-effect" 
         title="Click to pay electricity bill"
         style="left: 40.7%; top: 87.4%; width: 16.7%; height: 7.3%; border-radius: 9999px;">
    </div>

    <!-- Chip 4: Check my refund status -->
    <div onclick="setChipPrompt('Check refund status for pending transaction')" 
         class="hotspot ripple-effect" 
         title="Click to check refund"
         style="left: 58.3%; top: 87.4%; width: 16.2%; height: 7.3%; border-radius: 9999px;">
    </div>

    <!-- Chip 5: Raise a payment complaint -->
    <div onclick="setChipPrompt('Mere 599 rupees cut gaye par recharge pending hai')" 
         class="hotspot ripple-effect" 
         title="Click to raise complaint"
         style="left: 75.5%; top: 87.4%; width: 18.1%; height: 7.3%; border-radius: 9999px;">
    </div>


    <!-- ==================== 6. TOP NAVBAR HOTSPOTS ==================== -->
    <a href="index.html" 
       class="hotspot" 
       title="Paytm Home"
       style="left: 6.4%; top: 2.5%; width: 10.8%; height: 6.0%;">
    </a>

    <div onclick="paytm.openModal('download-modal')" 
         class="hotspot" 
         title="Download Paytm App"
         style="left: 73.0%; top: 2.5%; width: 9.8%; height: 6.0%;">
    </div>

    <div onclick="paytm.openModal('signin-modal')" 
         class="hotspot" 
         title="Sign In"
         style="left: 84.8%; top: 2.5%; width: 8.0%; height: 6.0%; border-radius: 9999px;">
    </div>

  </div>

  <input type="file" id="image-upload-input" accept="image/*" class="hidden" onchange="onImageSelected(event)">

  <script src="app.js"></script>
  <script>
    function executePrompt(query) {
      if (!query || !query.trim()) return;
      paytm.playSound('chime');
      
      const overlay = document.getElementById('portal-overlay');
      const portalText = document.getElementById('portal-text');
      if (portalText) portalText.textContent = `Analyzing: "${query.substring(0, 35)}..."`;
      if (overlay) overlay.classList.add('active');

      setTimeout(() => {
        window.location.href = `ai-workspace.html?q=${encodeURIComponent(query.trim())}`;
      }, 350);
    }

    function openMode(mode) {
      paytm.playSound('chime');
      const overlay = document.getElementById('portal-overlay');
      const portalText = document.getElementById('portal-text');
      if (portalText) portalText.textContent = mode === 'resolve' ? 'Opening Paytm Resolve Mode...' : 'Opening Paytm Action Mode...';
      if (overlay) overlay.classList.add('active');

      setTimeout(() => {
        window.location.href = `ai-workspace.html?mode=${mode}`;
      }, 350);
    }

    function handleSend() {
      const input = document.getElementById('ai-prompt-input');
      const query = input.value.trim() || 'Jio 299 recharge 2gb daily data';
      executePrompt(query);
    }

    function setChipPrompt(text) {
      const input = document.getElementById('ai-prompt-input');
      input.value = text;
      paytm.showToast(`Selected: "${text}"`, 'info', '💡');
      executePrompt(text); // Auto-execute immediately!
    }

    function triggerVoice() {
      const micBtn = document.getElementById('dashboard-mic-btn');
      const input = document.getElementById('ai-prompt-input');
      paytm.playSound('chime');

      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        const rec = new SpeechRec();
        rec.lang = 'hi-IN'; // Default Hindi prioritized
        rec.interimResults = true;
        rec.continuous = false;

        rec.onstart = () => {
          if (micBtn) micBtn.classList.add('voice-pulsing');
          paytm.showToast('🎙️ बोलिए... (Listening in Hindi/English)', 'info', '🎤');
        };

        rec.onresult = (e) => {
          let text = '';
          for (let i = e.resultIndex; i < e.results.length; ++i) {
            text += e.results[i][0].transcript;
          }
          input.value = text;
          if (e.results[0].isFinal) {
            paytm.showToast(`Captured: "${text}"`, 'success', '✅');
            setTimeout(() => executePrompt(text), 400); // Auto-execute on finish!
          }
        };

        rec.onerror = (e) => {
          if (micBtn) micBtn.classList.remove('voice-pulsing');
          input.value = 'Jio 300 recharge 2gb daily data aur netflix';
          executePrompt(input.value);
        };

        rec.onend = () => {
          if (micBtn) micBtn.classList.remove('voice-pulsing');
        };

        rec.start();
      } else {
        input.value = 'Jio 300 recharge 2gb daily data aur netflix';
        executePrompt(input.value);
      }
    }

    function quickAction(action) {
      let prompt = `Jio 300 budget 2gb daily data recharge`;
      if (action === 'Travel') prompt = 'Pune to Mumbai flights and bus tickets';
      else if (action === 'Bills') prompt = 'Pay MSEDCL electricity bill';
      else if (action === 'Shopping') prompt = 'Best budget laptop under 50000 on Google Shopping';
      else if (action === 'Offers') prompt = 'Best Paytm cashback offers today';
      executePrompt(prompt);
    }

    function quickResolve(resolveType) {
      let prompt = `Mere 599 rupees cut gaye par recharge pending hai, refund status check karo`;
      if (resolveType === 'Failed Payment') prompt = 'UPI transaction failed amount debited';
      executePrompt(prompt);
    }

    function switchLanguage() {
      paytm.playSound('click');
      const langs = ['हिंदी', 'English', 'मराठी'];
      const chosen = langs[Math.floor(Math.random() * langs.length)];
      paytm.showToast(`Language set to: ${chosen} (Auto Detect Active)`, 'info', '🌐');
    }

    function triggerImageUpload() {
      paytm.playSound('click');
      document.getElementById('image-upload-input').click();
    }

    function onImageSelected(e) {
      if (e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        paytm.showToast(`Analyzing receipt: ${file.name}`, 'info', '📷');
        executePrompt(`Analyze payment receipt: ${file.name}`);
      }
    }
  </script>
</body>
</html>
