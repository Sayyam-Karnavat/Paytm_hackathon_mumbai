<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paytm AI Workspace — Open Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="mockup.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #dceaff 0%, #ebf4fe 40%, #f4f8fd 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Top Sleek Nav Bar (Aligned with Card) */
    .top-nav-bar {
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      margin: 10px auto 4px auto;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #002970;
      padding: 7px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 41, 112, 0.1), 0 0 0 1px #e2e8f0;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .home-back-btn:hover {
      background: #002970;
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 41, 112, 0.2);
    }

    /* Contained & Perfectly Scaled Canvas Card (No Zoom / Razor Crisp) */
    .dashboard-wrapper {
      position: relative;
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      aspect-ratio: 1666 / 935;
      margin: 6px auto 20px auto;
      border-radius: 22px;
      box-shadow: 0 24px 60px -15px rgba(0, 41, 112, 0.22), 0 0 0 1px rgba(0, 41, 112, 0.08);
      background: #08214d;
      overflow: hidden;
    }

    /* Crisp High-Res Background Image */
    .dashboard-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Clean Workspace Overlay (Open space for hackathon additions) */
    .workspace-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 5%;
      z-index: 10;
      pointer-events: none;
    }

    /* Floating Active Query Pill */
    .query-indicator-pill {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 36px -4px rgba(0, 41, 112, 0.2), 0 0 0 1px rgba(0, 41, 112, 0.08);
      border-radius: 9999px;
      padding: 10px 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      animation: floatQuery 4s ease-in-out infinite;
    }

    .query-indicator-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px -4px rgba(0, 41, 112, 0.28);
    }

    @keyframes floatQuery {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body class="px-3 sm:px-6">

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Top Navigation Helper Bar -->
  <div class="top-nav-bar">
    <a href="ai-hub.html" class="home-back-btn interactive-btn">
      <span>←</span>
      <span>Back to AI Hub</span>
    </a>
    
    <div class="flex items-center gap-2">
      <div class="text-xs font-semibold text-[#002970]/80 flex items-center gap-1.5 bg-white/80 backdrop-blur-xs px-3 py-1.5 rounded-full border border-white/80 shadow-xs">
        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span>
        <span>Paytm AI Canvas Ready</span>
      </div>

      <a href="index.html" class="home-back-btn interactive-btn">
        <span>Paytm Home 🏠</span>
      </a>
    </div>
  </div>

  <!-- MAIN CONTAINED CANVAS (Matches AI Hub Card Dimensions & Crispness) -->
  <div class="dashboard-wrapper">
    
    <!-- High-Res Crisp Abstract Blue Wave Canvas -->
    <img src="assets/ai_chat_bg_clean.png" alt="Paytm AI Hub Abstract Wave Canvas" class="dashboard-img">

    <!-- OPEN CLEAN WORKSPACE: Free and ready for new buttons/components -->
    <div class="workspace-overlay">
      
      <!-- Subtle Floating Active Query Pill -->
      <div id="query-pill" class="query-indicator-pill">
        <span class="text-cyan-500 text-lg">✨</span>
        <span class="text-[#002970]/60 text-xs font-bold uppercase tracking-wider">Query:</span>
        <span id="active-query-text" class="text-[#002970] font-bold text-sm sm:text-base max-w-md truncate">Paytm AI Assistant Query</span>
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse ml-1"></span>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
  <script>
    // Read query from URL parameter and display cleanly
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    if (query) {
      document.getElementById('active-query-text').textContent = decodeURIComponent(query);
    } else {
      document.getElementById('active-query-text').textContent = "Paytm AI Hub Workspace (Ready for Action)";
    }
  </script>
</body>
</html>
