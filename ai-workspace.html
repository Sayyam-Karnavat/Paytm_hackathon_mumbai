<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paytm ONE — AI Universal Action Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="mockup.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #dceaff 0%, #ebf4fe 40%, #f4f8fd 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Top Sleek Nav Bar (Aligned with Card) */
    .top-nav-bar {
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      margin: 10px auto 4px auto;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      color: #002970;
      padding: 7px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 41, 112, 0.1), 0 0 0 1px #e2e8f0;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .home-back-btn:hover {
      background: #002970;
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 41, 112, 0.2);
    }

    /* Contained & Perfectly Scaled Canvas Card */
    .dashboard-wrapper {
      position: relative;
      width: min(980px, 94vw, calc((100vh - 85px) * 1.7818));
      aspect-ratio: 1666 / 935;
      margin: 6px auto 20px auto;
      border-radius: 22px;
      box-shadow: 0 24px 60px -15px rgba(0, 41, 112, 0.22), 0 0 0 1px rgba(0, 41, 112, 0.08);
      background: #08214d;
      overflow: hidden;
    }

    /* Crisp High-Res Background Image */
    .dashboard-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      opacity: 0.95;
    }

    /* Interactive Overlay Container */
    .workspace-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 24px 16px 24px;
      z-index: 10;
      overflow-y: auto;
    }

    /* Custom Scrollbar */
    .workspace-overlay::-webkit-scrollbar {
      width: 5px;
    }
    .workspace-overlay::-webkit-scrollbar-thumb {
      background: rgba(0, 185, 241, 0.4);
      border-radius: 9999px;
    }

    /* Mic Pulse Indicator */
    .mic-active {
      background: #ef4444 !important;
      color: white !important;
      animation: pulseMic 1.2s infinite;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }

    /* Numeric Keypad Buttons */
    .keypad-btn {
      width: 60px;
      height: 48px;
      border-radius: 12px;
      background: #f8fafc;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .keypad-btn:hover {
      background: #e2e8f0;
    }
    .keypad-btn:active {
      transform: scale(0.92);
      background: #cbd5e1;
    }
  </style>
</head>
<body class="px-2 sm:px-6">

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Top Navigation Helper Bar -->
  <div class="top-nav-bar">
    <a href="ai-hub.html" class="home-back-btn interactive-btn">
      <span>←</span>
      <span>Back to AI Hub</span>
    </a>
    
    <div class="flex items-center gap-2">
      <div class="text-xs font-semibold text-[#002970]/80 flex items-center gap-1.5 bg-white/80 backdrop-blur-xs px-3 py-1.5 rounded-full border border-white/80 shadow-xs">
        <span class="w-2 h-2 rounded-full bg-cyan-500 animate-ping"></span>
        <span id="header-status-badge">Paytm ONE Agent Ready</span>
      </div>

      <a href="index.html" class="home-back-btn interactive-btn">
        <span>Paytm Home 🏠</span>
      </a>
    </div>
  </div>

  <!-- MAIN CONTAINED CANVAS (Matches AI Hub Dimensions & Razor Sharp) -->
  <div class="dashboard-wrapper">
    
    <!-- High-Res Crisp Abstract Blue Wave Canvas -->
    <img src="assets/ai_chat_bg_clean.png" alt="Paytm AI Hub Canvas" class="dashboard-img">

    <!-- Interactive Workspace Overlay -->
    <div class="workspace-overlay">
      
      <!-- 1. Top Controls Bar inside Canvas -->
      <div class="flex items-center justify-between gap-3 bg-white/85 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-sm border border-white/90">
        <!-- Left: Logo & Assistant Identity -->
        <div class="flex items-center gap-2">
          <span class="text-lg font-black tracking-tight text-[#002970]">paytm</span>
          <span class="text-[10px] bg-[#00b9f1] text-[#002970] font-black px-2 py-0.5 rounded uppercase tracking-wider">ONE</span>
          <span class="text-xs text-slate-400 font-medium hidden sm:inline">| Action & Resolve OS</span>
        </div>

        <!-- Right: Language Selector & Voice Mic -->
        <div class="flex items-center gap-2">
          <!-- Language Toggle -->
          <div class="flex items-center bg-slate-100/90 rounded-full p-0.5 text-xs font-bold text-slate-600">
            <button onclick="changeLang('mr-IN')" id="lang-mr" class="px-2.5 py-1 rounded-full bg-[#002970] text-white shadow-xs">मराठी</button>
            <button onclick="changeLang('hi-IN')" id="lang-hi" class="px-2.5 py-1 rounded-full text-slate-600 hover:text-slate-900">हिंदी</button>
            <button onclick="changeLang('en-IN')" id="lang-en" class="px-2.5 py-1 rounded-full text-slate-600 hover:text-slate-900">English</button>
          </div>

          <!-- Live Mic Voice Button -->
          <button onclick="paytm.toggleVoiceRecognition()" 
                  id="header-mic-btn"
                  class="voice-mic-btn interactive-btn p-2 rounded-full bg-cyan-500 hover:bg-cyan-600 text-white shadow-md transition-all flex items-center justify-center text-sm"
                  title="Speak now (Voice Command)">
            🎙️
          </button>
        </div>
      </div>

      <!-- 2. Dynamic Agent Execution Area (Plan Card, Filters, Human Approval) -->
      <div id="workspace-dynamic-content" class="my-3 space-y-4">
        <!-- Content will be injected dynamically by agentEngine.processQuery() -->
        <div class="text-center py-12">
          <div class="w-12 h-12 border-3 border-cyan-400/40 border-t-cyan-500 rounded-full animate-spin mx-auto mb-3"></div>
          <p class="text-sm font-bold text-[#002970]">Paytm AI Agents Analyzing Your Request...</p>
        </div>
      </div>

      <!-- 3. Bottom Voice & Prompt Bar (Allows immediate continuous conversation) -->
      <div class="bg-white/90 backdrop-blur-md p-2 rounded-2xl shadow-lg border border-white/90 flex items-center gap-2">
        <!-- Voice Button -->
        <button onclick="paytm.toggleVoiceRecognition()" 
                class="voice-mic-btn interactive-btn w-10 h-10 rounded-xl bg-cyan-50 text-cyan-700 hover:bg-cyan-100 flex items-center justify-center text-lg shrink-0 border border-cyan-200">
          🎙️
        </button>

        <!-- Live Input Field -->
        <input type="text" 
               id="user-chat-prompt"
               class="flex-1 bg-transparent border-none outline-none text-xs sm:text-sm text-slate-800 placeholder-slate-400 font-medium px-2"
               placeholder="बोल किंवा टाईप करा (उदा. Jio 300 चा रिचार्ज, 2GB daily data, Netflix...)"
               onkeydown="if(event.key === 'Enter') sendNewQuery();">

        <!-- Send Button -->
        <button onclick="sendNewQuery()" 
                class="interactive-btn px-4 py-2 bg-gradient-to-r from-[#002970] to-[#00b9f1] text-white font-bold text-xs rounded-xl shadow-md flex items-center gap-1 shrink-0">
          <span>पाठवा</span>
          <span>➤</span>
        </button>
      </div>

    </div>

  </div>

  <!-- ==================== PAYTM UPI PIN SHEET / MODAL ==================== -->
  <div id="upi-pin-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-100 text-center relative animate-in zoom-in-95 duration-200">
      
      <!-- Close Button -->
      <button onclick="window.agentEngine.closePinModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg font-bold">
        ✕
      </button>

      <!-- Paytm UPI Brand Header -->
      <div class="flex items-center justify-center gap-1.5 mb-1">
        <span class="text-xl font-black text-[#002970]">paytm</span>
        <span class="text-xs bg-[#00b9f1] text-[#002970] font-black px-1.5 py-0.5 rounded uppercase">UPI</span>
      </div>
      <p class="text-[11px] text-slate-400">NPCI 256-bit Secure Gateway</p>

      <!-- Pay Details -->
      <div class="mt-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
        <div id="modal-pay-amount" class="text-3xl font-black text-[#002970]">₹299</div>
        <div id="modal-operator-name" class="text-xs font-semibold text-slate-600 mt-0.5">Jio Prepaid Recharge (28 Days)</div>
        <div class="text-[10px] text-slate-400 mt-1">From: SBI •••• 4821</div>
      </div>

      <!-- PIN Prompt -->
      <div class="mt-5">
        <div class="text-xs font-bold text-slate-700">Enter 4-Digit UPI PIN</div>
        
        <!-- 4 PIN Dots -->
        <div class="flex items-center justify-center gap-3 my-4">
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all"></div>
          <div class="pin-dot w-3.5 h-3.5 rounded-full bg-slate-200 transition-all"></div>
        </div>
      </div>

      <!-- Virtual Numeric Keypad -->
      <div class="grid grid-cols-3 gap-2 mt-4 max-w-[220px] mx-auto">
        <button onclick="window.agentEngine.handlePinKeypad('1')" class="keypad-btn">1</button>
        <button onclick="window.agentEngine.handlePinKeypad('2')" class="keypad-btn">2</button>
        <button onclick="window.agentEngine.handlePinKeypad('3')" class="keypad-btn">3</button>
        <button onclick="window.agentEngine.handlePinKeypad('4')" class="keypad-btn">4</button>
        <button onclick="window.agentEngine.handlePinKeypad('5')" class="keypad-btn">5</button>
        <button onclick="window.agentEngine.handlePinKeypad('6')" class="keypad-btn">6</button>
        <button onclick="window.agentEngine.handlePinKeypad('7')" class="keypad-btn">7</button>
        <button onclick="window.agentEngine.handlePinKeypad('8')" class="keypad-btn">8</button>
        <button onclick="window.agentEngine.handlePinKeypad('9')" class="keypad-btn">9</button>
        <button onclick="window.agentEngine.handlePinKeypad('back')" class="keypad-btn text-base text-red-500">⌫</button>
        <button onclick="window.agentEngine.handlePinKeypad('0')" class="keypad-btn">0</button>
        <button onclick="window.agentEngine.executeRechargePayment()" class="keypad-btn text-base text-emerald-600">✓</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Read initial query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || 'मला jio चं recharge करायचं आहे, 300 बजेट आहे, data 2gb daily पाहिजे आणि netflix subscription';

    // Initialize agent query processing once page loads
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('user-chat-prompt').value = initialQuery;
      if (window.agentEngine) {
        window.agentEngine.processQuery(initialQuery);
      }
    });

    function sendNewQuery() {
      const input = document.getElementById('user-chat-prompt');
      const val = input.value.trim();
      if (!val) return;
      paytm.playSound('click');
      if (window.agentEngine) {
        window.agentEngine.processQuery(val);
      }
    }

    function changeLang(langCode) {
      paytm.currentLanguage = langCode;
      ['mr', 'hi', 'en'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (langCode.includes(l)) {
          btn.classList.add('bg-[#002970]', 'text-white', 'shadow-xs');
          btn.classList.remove('text-slate-600');
        } else {
          btn.classList.remove('bg-[#002970]', 'text-white', 'shadow-xs');
          btn.classList.add('text-slate-600');
        }
      });
      paytm.playSound('click');
      sendNewQuery();
    }
  </script>
</body>
</html>
