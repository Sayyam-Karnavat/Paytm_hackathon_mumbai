<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paytm AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="mockup.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background: #0d2847 url('assets/ai_chat_bg_hd.png') no-repeat center center fixed;
      background-size: cover;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Minimalist Glass Header */
    .minimal-glass-header {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Subtle Floating Query Pill */
    .query-indicator-pill {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 41, 112, 0.25);
    }
  </style>
</head>
<body class="flex flex-col justify-between h-screen select-none">

  <!-- MINIMAL SLEEK TOP BAR -->
  <header class="minimal-glass-header w-full px-6 py-4 flex items-center justify-between z-50">
    
    <!-- Left: Back to AI Hub Navigation -->
    <div class="flex items-center gap-4">
      <a href="ai-hub.html" class="interactive-btn flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white font-bold text-xs sm:text-sm px-4 py-2 rounded-full border border-white/30 transition-all">
        <span>←</span>
        <span>Back to AI Hub</span>
      </a>

      <div class="h-5 w-px bg-white/30"></div>

      <!-- Paytm Logo -->
      <div class="flex items-center gap-1.5">
        <span class="text-xl font-black tracking-tight text-white">paytm</span>
        <span class="text-[11px] bg-cyan-400 text-[#002970] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">AI</span>
      </div>
    </div>

    <!-- Center/Right: Subtle Status Indicator -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-white/15 border border-white/25 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="text-white/90">AI Canvas Ready</span>
      </div>

      <a href="index.html" class="interactive-btn text-xs font-bold text-white/80 hover:text-white bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-full border border-white/20 transition-all">
        Paytm Home 🏠
      </a>
    </div>

  </header>

  <!-- COMPLETELY CLEAN, OPEN, SPACIOUS CANVAS -->
  <!-- "mokle ahe tasch rahude, aapun tyvar ntr buton he sarv basvu" -->
  <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
    
    <!-- Subtle Floating Active Query Pill -->
    <div id="query-pill" class="query-indicator-pill rounded-full px-6 py-3 flex items-center gap-3 text-sm font-semibold max-w-lg transition-all animate-in fade-in zoom-in-95 duration-300">
      <span class="text-cyan-300 text-lg">✨</span>
      <span class="text-white/80 text-xs">Query:</span>
      <span id="active-query-text" class="text-white font-bold truncate">Paytm AI Assistant Query</span>
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse ml-2"></span>
    </div>

  </main>

  <!-- MINIMAL BOTTOM BAR -->
  <footer class="py-3 px-6 text-center text-xs text-white/40">
    Paytm AI Hub • Workspace Ready
  </footer>

  <script src="app.js"></script>
  <script>
    // Read query from URL parameter and display cleanly
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    if (query) {
      document.getElementById('active-query-text').innerText = query;
    } else {
      document.getElementById('query-pill').style.display = 'none';
    }
  </script>
</body>
</html>
